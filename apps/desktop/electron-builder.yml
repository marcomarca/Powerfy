appId: com.powermanager.app
productName: PowerManager
directories:
  output: release
  buildResources: resources

files:
  - dist-electron/**/*
  - dist-renderer/**/*
  - package.json

extraResources:
  - from: resources/native
    to: native
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: PowerManager

publish:
  provider: github
  owner: powermanager
  repo: powermanager
