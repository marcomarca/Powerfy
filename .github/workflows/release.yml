name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Tests (TypeScript & .NET 10)
        run: |
          bun test
          dotnet test PowerManager.slnx

      - name: Publish NativeHost Self-Contained Binary
        run: dotnet publish native/PowerManager.NativeHost/PowerManager.NativeHost.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o apps/desktop/resources/native

      - name: Build Frontend & Electron Main
        run: bun run build

      - name: Package Installer, Portable & Zip with Electron Builder
        run: bun --filter desktop run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            apps/desktop/dist-package/*.exe
            apps/desktop/dist-package/*.zip
            apps/desktop/dist-package/*.blockmap
            apps/desktop/dist-package/latest.yml
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
